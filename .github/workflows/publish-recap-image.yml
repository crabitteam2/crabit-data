name: Publish Recap Image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recap-image-publication-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: dockerhub
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
      image_reference: ${{ steps.publish.outputs.image_reference }}
      image_tag: ${{ steps.publish.outputs.image_tag }}
      image_architecture: ${{ steps.publish.outputs.image_architecture }}
      image_config_digest: ${{ steps.publish.outputs.image_config_digest }}
      image_revision: ${{ steps.publish.outputs.image_revision }}
      publication_result: ${{ steps.publish.outputs.publication_result }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: recap_service/runtime-requirements.txt
      - name: Verify the dispatched main revision
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
      - name: Verify Python behavior and syntax
        run: |
          python -m unittest discover -s tests -v
          python -m compileall monthly_batch.py monthly_recap.py recap_presenter.py recap_service weekly_batch.py weekly_recap.py tests
      - name: Build and exercise the exact production image
        shell: bash
        run: |
          set -Eeuo pipefail
          image="crabit-recap:sha-${GITHUB_SHA:0:12}"
          docker build --provenance=false --platform linux/amd64 \
            --metadata-file "${RUNNER_TEMP}/tested-image-metadata.json" \
            --build-arg "VCS_REF=${GITHUB_SHA}" --tag "${image}" .
          jq -e '.["containerimage.digest"] | test("^sha256:[0-9a-f]{64}$")' \
            "${RUNNER_TEMP}/tested-image-metadata.json" >/dev/null
          jq -e '.["containerimage.config.digest"] | test("^sha256:[0-9a-f]{64}$")' \
            "${RUNNER_TEMP}/tested-image-metadata.json" >/dev/null
          ./scripts/deployment/verify-image.sh "${image}" "${GITHUB_SHA}"
          ./scripts/deployment/verify-runtime.sh "${image}"
          ./scripts/deployment/verify-workflow.sh
          git diff --check
      - name: Authenticate to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish or adopt immutable recap tag
        id: publish
        shell: bash
        run: |
          ./scripts/deployment/publish-image.sh \
            "${GITHUB_SHA}" \
            "${RUNNER_TEMP}/tested-image-metadata.json" \
            "${GITHUB_OUTPUT}"
      - name: Record immutable registry read-back
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.image_digest }}
          IMAGE_REFERENCE: ${{ steps.publish.outputs.image_reference }}
          IMAGE_TAG: ${{ steps.publish.outputs.image_tag }}
          IMAGE_ARCHITECTURE: ${{ steps.publish.outputs.image_architecture }}
          IMAGE_CONFIG_DIGEST: ${{ steps.publish.outputs.image_config_digest }}
          IMAGE_REVISION: ${{ steps.publish.outputs.image_revision }}
          PUBLICATION_RESULT: ${{ steps.publish.outputs.publication_result }}
        run: |
          set -Eeuo pipefail
          {
            printf '## Immutable recap image read-back\n\n'
            printf -- '- Result: `%s`\n' "${PUBLICATION_RESULT}"
            printf -- '- Tag: `%s`\n' "${IMAGE_TAG}"
            printf -- '- Digest: `%s`\n' "${IMAGE_DIGEST}"
            printf -- '- Reference: `%s`\n' "${IMAGE_REFERENCE}"
            printf -- '- Config digest: `%s`\n' "${IMAGE_CONFIG_DIGEST}"
            printf -- '- Architecture: `%s`\n' "${IMAGE_ARCHITECTURE}"
            printf -- '- Revision: `%s`\n' "${IMAGE_REVISION}"
          } >> "${GITHUB_STEP_SUMMARY}"

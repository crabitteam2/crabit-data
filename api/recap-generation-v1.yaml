openapi: 3.1.0
info:
  title: Crabit Recap Generation API
  version: 1.0.0
  description: Stateless, synchronous backend-to-Python recap generation contract.
paths:
  /internal/v1/recap-generations:
    post:
      operationId: generateRecap
      security:
        - RecapBearer: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Canonical UUID exactly equal to generation_id.
          schema: {$ref: '#/components/schemas/Uuid'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerationRequest'}
      responses:
        '200':
          description: Deterministic complete recap result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GenerationResult'}
        '400': {$ref: '#/components/responses/Malformed'}
        '401': {$ref: '#/components/responses/Auth'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/Unsupported'}
        '422': {$ref: '#/components/responses/Invalid'}
        '500': {$ref: '#/components/responses/Calculation'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    RecapBearer:
      type: http
      scheme: bearer
      description: Recap-only opaque machine credential.
  responses:
    Malformed: {$ref: '#/components/responses/Error400'}
    Auth:
      description: Missing or invalid recap credential.
      headers:
        WWW-Authenticate: {schema: {type: string, const: Bearer}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    TooLarge: {description: Body exceeds 4194304 bytes., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unsupported: {description: Media type is not application/json., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Invalid: {description: Valid JSON violates the closed recap input contract., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Calculation: {description: Deterministic calculation failure., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unavailable: {description: Temporary service failure., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Error400: {description: Malformed JSON, duplicate keys, method, path, or query., content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Uuid: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'}
    SafeInteger: {type: integer, minimum: 0, maximum: 9007199254740991}
    Digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    Instant: {type: string, format: date-time, pattern: 'Z$'}
    Period:
      type: object
      additionalProperties: false
      required: [start_date, end_date_exclusive, timezone]
      properties:
        start_date: {type: string, format: date}
        end_date_exclusive: {type: string, format: date}
        timezone: {type: string, const: Asia/Seoul}
    Wish:
      type: object
      additionalProperties: false
      required: [wish_id, title, target_amount, created_at, closed_at, deleted_at, status, is_representative, saved_amount_at_period_end]
      properties:
        wish_id: {$ref: '#/components/schemas/Uuid'}
        title: {type: string, minLength: 1, maxLength: 200}
        target_amount: {$ref: '#/components/schemas/SafeInteger'}
        created_at: {$ref: '#/components/schemas/Instant'}
        closed_at: {oneOf: [{$ref: '#/components/schemas/Instant'}, {type: 'null'}]}
        deleted_at: {oneOf: [{$ref: '#/components/schemas/Instant'}, {type: 'null'}]}
        status: {type: string, enum: [IN_PROGRESS, AMOUNT_REACHED, COMPLETED, ABANDONED]}
        is_representative: {type: boolean}
        saved_amount_at_period_end: {$ref: '#/components/schemas/SafeInteger'}
    EffectiveTransaction:
      type: object
      additionalProperties: false
      required: [root_event_id, wish_id, occurred_at, amount, type]
      properties:
        root_event_id: {$ref: '#/components/schemas/Uuid'}
        wish_id: {$ref: '#/components/schemas/Uuid'}
        occurred_at: {$ref: '#/components/schemas/Instant'}
        amount: {type: integer, minimum: 1, maximum: 9007199254740991}
        type: {type: string, enum: [DEPOSIT, WITHDRAWAL, TRANSFER_OUT, TRANSFER_IN, COMPLETION_RETURN, ABANDONMENT_RETURN, DELETION_RETURN]}
    VisitMetrics:
      type: object
      additionalProperties: false
      required: [received_visit_count, unique_received_visitor_count, previous_week_received_visit_count, monthly_outgoing_visit_count]
      properties:
        received_visit_count: {$ref: '#/components/schemas/SafeInteger'}
        unique_received_visitor_count: {$ref: '#/components/schemas/SafeInteger'}
        previous_week_received_visit_count: {$ref: '#/components/schemas/SafeInteger'}
        monthly_outgoing_visit_count: {$ref: '#/components/schemas/SafeInteger'}
    PeerMetrics:
      type: object
      additionalProperties: false
      required: [habit_active_weeks, achievement_rates]
      properties:
        habit_active_weeks: {type: array, maxItems: 10000, items: {$ref: '#/components/schemas/SafeInteger'}}
        achievement_rates: {type: array, maxItems: 10000, items: {type: number, minimum: 0}}
    AuthorPreviousMonth:
      description: >-
        Exactly one of a legacy partial aggregate or complete core-metrics-v1 aggregate.
        Presence of metrics_version always selects complete validation; an invalid marker
        or incomplete complete aggregate must never fall back to the legacy branch.
        Complete metrics describe all account-owned Wishes in the month preceding each
        story completion month in Asia/Seoul, including deleted-Wish activity and outgoing visits.
        Complete inputs derive type_title through the original CoreMetrics classifier and
        build_type_section; the supplied candidate type_title remains required but is ignored.
        Legacy inputs preserve the supplied type_title without inventing missing metrics.
      oneOf:
        - {$ref: '#/components/schemas/LegacyAuthorPreviousMonth'}
        - {$ref: '#/components/schemas/CompleteAuthorPreviousMonth'}
    LegacyAuthorPreviousMonth:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        deposit_count: {$ref: '#/components/schemas/SafeInteger'}
        avg_amount: {type: number, minimum: 0}
        regularity_std: {type: number, minimum: 0}
        pace_bias: {type: number, minimum: 0}
        abandon_count: {$ref: '#/components/schemas/SafeInteger'}
        transfer_count: {$ref: '#/components/schemas/SafeInteger'}
        visit_count: {$ref: '#/components/schemas/SafeInteger'}
    CompleteAuthorPreviousMonth:
      type: object
      additionalProperties: false
      required: [metrics_version, deposit_count, total_savings, avg_amount, regularity_std, pace_bias, abandon_count, transfer_count, visit_count]
      properties:
        metrics_version: {type: string, const: core-metrics-v1}
        deposit_count: {$ref: '#/components/schemas/SafeInteger'}
        total_savings: {type: integer, minimum: -9007199254740991, maximum: 9007199254740991}
        avg_amount: {type: number, description: Finite signed average amount; booleans are invalid.}
        regularity_std: {type: [number, 'null'], minimum: 0, description: Finite nonnegative population deviation of distinct deposit-day gaps or null when undefined.}
        pace_bias: {type: [number, 'null'], description: Finite signed (second-half net minus first-half net) divided by total savings; null when total savings is nonpositive.}
        abandon_count: {$ref: '#/components/schemas/SafeInteger'}
        transfer_count: {$ref: '#/components/schemas/SafeInteger'}
        visit_count: {$ref: '#/components/schemas/SafeInteger'}
      examples:
        - {metrics_version: core-metrics-v1, deposit_count: 0, total_savings: 0, avg_amount: 0, regularity_std: null, pace_bias: null, abandon_count: 0, transfer_count: 0, visit_count: 0}
        - {metrics_version: core-metrics-v1, deposit_count: 1, total_savings: -500, avg_amount: -500, regularity_std: null, pace_bias: null, abandon_count: 1, transfer_count: 2, visit_count: 3}
    SuccessStoryCandidate:
      type: object
      additionalProperties: false
      required: [wish_id, type_title, author_previous_month]
      properties:
        wish_id: {$ref: '#/components/schemas/Uuid'}
        type_title: {type: string, minLength: 1, maxLength: 100}
        author_previous_month: {$ref: '#/components/schemas/AuthorPreviousMonth'}
    GenerationInput:
      type: object
      additionalProperties: false
      required: [representative_wish_id, wishes, effective_transactions, visit_metrics, peer_metrics, success_story_candidates]
      properties:
        representative_wish_id: {oneOf: [{$ref: '#/components/schemas/Uuid'}, {type: 'null'}]}
        wishes: {type: array, maxItems: 10000, items: {$ref: '#/components/schemas/Wish'}}
        effective_transactions: {type: array, maxItems: 100000, items: {$ref: '#/components/schemas/EffectiveTransaction'}}
        visit_metrics: {$ref: '#/components/schemas/VisitMetrics'}
        peer_metrics: {$ref: '#/components/schemas/PeerMetrics'}
        success_story_candidates: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/SuccessStoryCandidate'}}
    GenerationRequest:
      type: object
      additionalProperties: false
      required: [schema_version, algorithm_version, generation_id, input_digest, student_id, card_balance_account_id, academy_id, kind, period, reference_date, snapshot_at, input]
      properties:
        schema_version: {type: integer, const: 1}
        algorithm_version: {type: string, const: recap-1}
        generation_id: {$ref: '#/components/schemas/Uuid'}
        input_digest: {$ref: '#/components/schemas/Digest'}
        student_id: {$ref: '#/components/schemas/Uuid'}
        card_balance_account_id: {$ref: '#/components/schemas/Uuid'}
        academy_id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string, enum: [WEEKLY, MONTHLY]}
        period: {$ref: '#/components/schemas/Period'}
        reference_date: {type: string, format: date}
        snapshot_at: {$ref: '#/components/schemas/Instant'}
        input: {$ref: '#/components/schemas/GenerationInput'}
    GenerationResult:
      type: object
      additionalProperties: false
      required: [schema_version, algorithm_version, generation_id, input_digest, student_id, card_balance_account_id, academy_id, kind, period, view, internal_metrics]
      properties:
        schema_version: {type: integer, const: 1}
        algorithm_version: {type: string, const: recap-1}
        generation_id: {$ref: '#/components/schemas/Uuid'}
        input_digest: {$ref: '#/components/schemas/Digest'}
        student_id: {$ref: '#/components/schemas/Uuid'}
        card_balance_account_id: {$ref: '#/components/schemas/Uuid'}
        academy_id: {$ref: '#/components/schemas/Uuid'}
        kind: {type: string, enum: [WEEKLY, MONTHLY]}
        period: {$ref: '#/components/schemas/Period'}
        view: {type: object}
        internal_metrics: {type: object}
    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable, trace_id, field_errors]
      properties:
        code: {type: string, enum: [MALFORMED_REQUEST, AUTH_REQUIRED, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE, RECAP_INPUT_INVALID, RECAP_CALCULATION_FAILED, RECAP_SERVICE_UNAVAILABLE]}
        message: {type: string, minLength: 1, maxLength: 300}
        retryable: {type: boolean}
        trace_id: {type: string, pattern: '^[0-9a-f]{24}$'}
        field_errors: {type: array, maxItems: 100, items: {type: string, maxLength: 300}}
